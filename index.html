<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menuz Tableside V3 - Hopyard Tap House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --bg:#12191E;--s1:#1B252C;--s2:#243039;--line:#33424D;--tx:#F0EBDD;--mu:#A5B1B8;
  --ac:#F2A93B;--acink:#1B1206;--ok:#93CC8F;--bad:#F39A8B;--r:14px;
  --fh:'Bricolage Grotesque','Avenir Next','Trebuchet MS',system-ui,sans-serif;
  --fb:'Instrument Sans','Segoe UI',system-ui,sans-serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
:root[data-skin="harbor"]{--bg:#0E1B1E;--s1:#162A2E;--s2:#1F3A3F;--line:#2E4F55;--tx:#EAF3EF;--mu:#9DB8B5;--ac:#6FD3C1;--acink:#05231E}
:root[data-skin="plum"]{--bg:#1A1420;--s1:#251C2D;--s2:#31253B;--line:#4A3958;--tx:#F5EAF0;--mu:#B9A6BC;--ac:#F19CC4;--acink:#2B0E1E}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 var(--fb);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--fh);margin:0;line-height:1.15}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px;border-radius:8px}
.mu{color:var(--mu)}
.shell{max-width:480px;margin:0 auto;padding:0 16px}
.shell.wide{max-width:760px}

/* prototype bar */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.proto .in{max-width:760px;margin:0 auto;padding:8px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.seg{display:flex;background:var(--s1);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:8px 18px;border-radius:999px;min-height:40px;font-weight:600;color:var(--mu)}
.seg button[aria-pressed="true"]{background:var(--ac);color:var(--acink)}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:40px;color:var(--mu)}
.offline-pill{background:var(--bad);color:#2B0C07;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}

/* guest header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:22px 0 14px}
.venue{font:800 26px/1.05 var(--fh);letter-spacing:-.01em}
.tablepill{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 14px;font-weight:600;white-space:nowrap}
.tablepill button{background:var(--s2);border:0;border-radius:999px;padding:6px 12px;min-height:36px;color:var(--mu)}
.banner{background:var(--s2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-size:15px}
.banner.warn{border-color:var(--bad)}

/* The Round */
.round{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:22px;padding:20px 18px 18px;margin-bottom:22px}
.round h2{font-size:34px;font-weight:800;letter-spacing:-.02em}
.round .tag{margin:6px 0 2px;font-size:16px}
.round .rules{margin:0;color:var(--mu);font-size:14px}
.who{display:flex;align-items:center;gap:14px;margin:18px 0 12px}
.who .lbl{font-weight:600}
.stepper{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:999px}
.stepper button{width:52px;height:52px;border:0;background:none;font-size:26px;border-radius:999px;color:var(--tx)}
.stepper button:disabled{opacity:.3;cursor:default}
.stepper output{min-width:44px;text-align:center;font:800 28px var(--fh)}
.glasses{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;margin-bottom:14px}
.glass{width:28px;height:38px;transform-origin:50% 100%}
.glass.pop{animation:pop .35s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{transform:scale(.4) translateY(6px);opacity:0}to{transform:none;opacity:1}}
.rlines{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rline{border-bottom:1px solid var(--line);padding:10px 0}
.rrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.rrow .nm{flex:1;min-width:0}
.rrow .qty{font-weight:600}
.rrow .amt{font-variant-numeric:tabular-nums;font-weight:600}
.swapbtn{background:none;border:1px solid var(--line);border-radius:999px;color:var(--ac);padding:6px 12px;min-height:40px;font-weight:600}
.opts{display:grid;gap:6px;margin-top:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:48px}
.opt[aria-checked="true"]{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.opt:disabled{opacity:.45;cursor:default}
.delta{color:var(--ac);font-weight:600;white-space:nowrap;font-size:14px}
.delta.neg{color:var(--ok)}
.rtot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:16px 0 14px}
.rtot .big{font:800 40px/1 var(--fh);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rtot .save{text-align:right;font-size:14px;color:var(--ok);font-weight:600}
.rtot .save s{color:var(--mu);font-weight:400;display:block}
.cta{width:100%;min-height:56px;border:0;border-radius:16px;background:var(--ac);color:var(--acink);font-weight:600;font-size:17px;display:flex;justify-content:space-between;align-items:center;padding:0 20px}
.cta:disabled{opacity:.5;cursor:default}
.cta.sec{background:var(--s2);color:var(--tx);border:1px solid var(--line)}
.note-ok{color:var(--ok);font-size:14px;margin:8px 0 0}
.note-warn{color:var(--bad);font-size:14px;margin:8px 0 0}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.chip{border:1px solid var(--line);background:var(--s1);border-radius:999px;padding:0 16px;min-height:48px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.sameagain{margin-bottom:14px}

/* menu items */
.cat{margin:0 0 26px}
.cat h2{font-size:22px;margin-bottom:8px}
.item{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.tile{width:56px;height:56px;border-radius:14px;display:grid;place-items:center}
.tile svg{width:34px;height:34px}
.item h3{font-size:17px;font-weight:600}
.item p{margin:3px 0 6px;color:var(--mu);font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag-b{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--mu)}
.tag-b.v{color:var(--ok);border-color:var(--ok)}
.tag-b.so{color:var(--bad);border-color:var(--bad)}
.iact{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.price{font-weight:600;font-variant-numeric:tabular-nums}
.addbtn{width:48px;height:48px;border-radius:50%;border:0;background:var(--ac);color:var(--acink);font-size:26px;line-height:1}
.mini{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:999px}
.mini button{width:48px;height:48px;border:0;background:none;font-size:22px;border-radius:50%}
.mini span{min-width:20px;text-align:center;font-weight:600}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.spacer{height:110px}

/* cart bar */
.cbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.cbar .cta{max-width:480px;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.cbar .cta .cnt{background:var(--acink);color:var(--ac);border-radius:999px;min-width:28px;height:28px;display:inline-grid;place-items:center;margin-right:10px;font-size:14px}

/* sheets */
.ov{position:fixed;inset:0;background:rgba(5,9,12,.66);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--s1);width:100%;max-width:480px;max-height:90vh;max-height:90dvh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out;border:1px solid var(--line);border-bottom:0}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.panel h2{font-size:26px;margin-bottom:4px}
.panel .x{float:right;background:var(--s2);border:0;border-radius:50%;width:44px;height:44px;font-size:20px}
.entry{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:10px 0}
.entry.bad{border-color:var(--bad)}
.entry ul{margin:6px 0 8px;padding-left:18px;color:var(--mu);font-size:14px}
.entry .eh{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.entry .ea{display:flex;gap:8px;margin-top:6px}
.lnk{background:none;border:1px solid var(--line);border-radius:999px;padding:0 14px;min-height:44px;color:var(--tx)}
.pay{display:grid;gap:8px;margin:14px 0}
.payopt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:56px}
.payopt[aria-checked="true"]{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.payopt b{display:block}
textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;min-height:64px;resize:vertical}
.totrow{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 12px;font-weight:600}
.totrow .big{font:800 30px var(--fh)}
.err{color:var(--bad);margin:0 0 10px;font-size:15px}
.stripebox{border:2px dashed var(--line);border-radius:var(--r);padding:22px 14px;text-align:center;color:var(--mu);margin:14px 0}
.check{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#0E2410;display:grid;place-items:center;font-size:34px;margin:6px 0 12px}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:16px 0}
.track div{text-align:center;font-size:13px;color:var(--mu);border-top:4px solid var(--line);padding-top:6px}
.track div.on{border-color:var(--ac);color:var(--tx);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;max-width:min(440px,92vw);text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.grid button{min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font:700 20px var(--fh)}
.toolrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.toolrow .row-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sw{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.sw[aria-pressed="true"]{background:var(--ac);color:var(--acink);border-color:var(--ac)}

/* staff */
.stitle{display:flex;justify-content:space-between;align-items:center;padding:20px 0 12px;gap:10px}
.stitle h1{font-size:28px;font-weight:800}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;min-height:48px;border:1px solid var(--line);background:var(--s1);border-radius:12px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.ticket{background:var(--s1);border:1px solid var(--line);border-left:6px solid var(--ac);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.ticket.st-accepted{border-left-color:#7FB3FF}
.ticket.st-ready{border-left-color:var(--ok)}
.ticket.st-served{opacity:.55;border-left-color:var(--line)}
.ticket.fresh{animation:flash 1.4s ease-out}
@keyframes flash{0%,40%{background:var(--s2);box-shadow:0 0 0 3px var(--ac)}100%{background:var(--s1);box-shadow:none}}
.thead{display:flex;align-items:center;gap:12px}
.tno{font:800 40px/1 var(--fh);min-width:56px}
.thead .grow{flex:1}
.badge{border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;border:1px solid var(--line)}
.badge.paid{color:var(--ok);border-color:var(--ok)}
.badge.unpaid{color:var(--ac);border-color:var(--ac)}
.tgroup{margin:10px 0;padding:10px 12px;background:var(--bg);border-radius:12px}
.tgroup ul,.tsingles{margin:4px 0 0;padding-left:18px}
.tnote{margin:8px 0;padding:8px 12px;border-left:3px solid var(--bad);background:var(--bg);border-radius:0 8px 8px 0}
.tacts{display:flex;gap:8px;margin-top:10px}
.tacts button{flex:1;min-height:52px;border-radius:12px;border:0;background:var(--ac);color:var(--acink);font-weight:600}
.row86{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.metric{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px}
.metric .n{font:800 32px var(--fh)}
.metric .l{color:var(--mu);font-size:14px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="proto"><div class="in" id="proto"></div></div>
<main id="app"></main>
<div class="cbar" id="cbar"></div>
<div id="sheet"></div>
<div id="toast" aria-live="polite"></div>

<script>
/* ------------------------------------------------------------------
   Menuz Tableside V3 - Stage 1 clickable prototype
   Menu data below mirrors the published-snapshot JSON described in the
   system architecture. Pricing and validation run in serverCreateOrder(),
   which stands in for POST /orders (client only previews prices).
------------------------------------------------------------------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = c => (c < 0 ? '-' : '') + '$' + (Math.abs(c) / 100).toFixed(2);
const signed = c => (c > 0 ? '+' : c < 0 ? '-' : '') + '$' + (Math.abs(c) / 100).toFixed(2);

const VENUE = { name: 'Hopyard Tap House', tables: 24, payAtTable: true, payOnline: true };
const ALLERGENS = { gluten: 'Gluten', milk: 'Milk', peanuts: 'Peanuts', nuts: 'Tree nuts', sesame: 'Sesame', sulphites: 'Sulphites', egg: 'Egg' };
const CATS = [
  { id: 'beer', name: 'Beer and cider' },
  { id: 'snacks', name: 'Snacks' },
  { id: 'share', name: 'Sharing platters' },
  { id: 'soft', name: 'Soft drinks' }
];
const ITEMS = [
  { id: 'b_pale', cat: 'beer', name: 'Hopyard Pale Ale', desc: 'Citrus and pine, easy to drink. 5.2% ABV, 330 ml.', price: 700, alc: true, al: ['gluten'], veg: true, glyph: 'pint', hue: 38 },
  { id: 'b_lager', cat: 'beer', name: 'Golden Lager', desc: 'Crisp and clean. 4.6% ABV, 330 ml.', price: 650, alc: true, al: ['gluten'], veg: true, glyph: 'pint', hue: 48 },
  { id: 'b_ipa', cat: 'beer', name: 'Copperhead IPA', desc: 'Resinous and bitter, big hops. 6.4% ABV, 330 ml.', price: 850, alc: true, al: ['gluten'], veg: true, glyph: 'pint', hue: 28 },
  { id: 'b_stout', cat: 'beer', name: 'Midnight Stout', desc: 'Roasted coffee and cocoa. 5.0% ABV, 330 ml.', price: 800, alc: true, al: ['gluten', 'milk'], veg: true, glyph: 'pint', hue: 20 },
  { id: 'b_cider', cat: 'beer', name: 'Dry Orchard Cider', desc: 'Apples, no sugar added. 4.8% ABV, 330 ml.', price: 750, alc: true, al: ['sulphites'], veg: true, glyph: 'pint', hue: 95 },
  { id: 'b_zero', cat: 'beer', name: '0.0 Lager', desc: 'All the flavour, no alcohol. 330 ml.', price: 550, alc: false, al: ['gluten'], veg: true, glyph: 'pint', hue: 55 },
  { id: 's_chips', cat: 'snacks', name: 'Chips bowl', desc: 'Hand-cut, sea salt, smoky dip.', price: 600, alc: false, al: [], veg: true, glyph: 'bowl', hue: 42 },
  { id: 's_pretzel', cat: 'snacks', name: 'Soft pretzel', desc: 'Warm, with beer cheese.', price: 900, alc: false, al: ['gluten', 'milk', 'egg'], veg: true, glyph: 'bowl', hue: 30 },
  { id: 's_peanuts', cat: 'snacks', name: 'Spiced peanuts', desc: 'Roasted with paprika and lime.', price: 500, alc: false, al: ['peanuts'], veg: true, glyph: 'bowl', hue: 25 },
  { id: 's_nachos', cat: 'snacks', name: 'Nacho tower', desc: 'Corn chips, cheese, jalapeños, salsa.', price: 1600, alc: false, al: ['milk'], veg: true, glyph: 'bowl', hue: 15 },
  { id: 'p_board', cat: 'share', name: 'Pub board', desc: 'Cured meats, cheddar, pickles, bread. Feeds 3 to 4.', price: 1800, alc: false, al: ['gluten', 'milk'], veg: false, glyph: 'platter', hue: 8 },
  { id: 'p_veg', cat: 'share', name: 'Veggie mezze', desc: 'Hummus, falafel, grilled halloumi, flatbread. Feeds 3 to 4.', price: 1700, alc: false, al: ['gluten', 'sesame', 'milk'], veg: true, glyph: 'platter', hue: 110 },
  { id: 'p_wings', cat: 'share', name: 'Wing platter', desc: 'Sixteen smoked wings, hot sauce, blue cheese. Feeds 3 to 4.', price: 2200, alc: false, al: ['milk'], veg: false, glyph: 'platter', hue: 12 },
  { id: 'd_cola', cat: 'soft', name: 'Cola', desc: 'Bottle, 330 ml.', price: 350, alc: false, al: [], veg: true, glyph: 'can', hue: 5 },
  { id: 'd_lemonade', cat: 'soft', name: 'Cloudy lemonade', desc: 'Pressed lemons, not too sweet.', price: 400, alc: false, al: [], veg: true, glyph: 'can', hue: 60 }
];
const ITEM = Object.fromEntries(ITEMS.map(i => [i.id, i]));

/* Package rules: per_guest = N x qty; chunk = ceil(N / chunk) x qty */
const PKG = {
  round: {
    id: 'round', name: 'The Round', tagline: 'One drink each, chips and a platter for the table.',
    rules: '1 drink each, plus 1 chips bowl and 1 platter for every 4 people.',
    min: 2, max: 12, def: 4, discountPct: 10,
    components: [
      { slot: 'drink', label: 'Drink each', mode: 'per_guest', qty: 1, unit: 'each', item: 'b_pale', options: ['b_pale', 'b_lager', 'b_ipa', 'b_cider', 'b_zero'] },
      { slot: 'chips', label: 'Chips bowl', mode: 'chunk', chunk: 4, qty: 1, unit: 'per bowl', item: 's_chips', options: ['s_chips'] },
      { slot: 'platter', label: 'Shared platter', mode: 'chunk', chunk: 4, qty: 1, unit: 'per platter', item: 'p_board', options: ['p_board', 'p_veg', 'p_wings'] }
    ]
  }
};
const defSel = p => Object.fromEntries(p.components.map(c => [c.slot, c.item]));

/* ---------------- state ---------------- */
const S = {
  view: 'guest', table: null, filters: new Set(), online: true, payFail: false, skin: 'tap',
  ageOk: false, pending: null,
  round: { n: PKG.round.def, sel: defSel(PKG.round), open: null, shown: 0, notice: '' },
  editing: null, cart: [], note: '', payMode: 'table', sheet: null, err: '', payErr: '',
  orders: [], eightySix: new Set(), lastOrder: null, idem: { key: null, ts: 0, order: null },
  ev: { scan: 0, start: 0, placed: 0, attach: 0, revenue: 0 }, started: false,
  staffTab: 'orders', soundOn: false, fresh: new Set(), uid: 1
};

/* ---------------- pricing (client preview + server truth) ---------------- */
function quote(p, n, sel) {
  const lines = p.components.map(c => {
    const it = ITEM[sel[c.slot] || c.item];
    const qty = c.mode === 'per_guest' ? n * c.qty : Math.ceil(n / c.chunk) * c.qty;
    return { slot: c.slot, label: c.label, item: it, qty, unit: it.price, total: it.price * qty };
  });
  const sub = lines.reduce((a, l) => a + l.total, 0);
  const disc = Math.round(sub * p.discountPct / 100);
  const total = sub - disc;
  return { lines, sub, disc, total, pp: Math.round(total / n) };
}
function entryIssues(e) {
  if (e.type === 'item') {
    const it = ITEM[e.itemId];
    return !it ? ['Unknown item'] : S.eightySix.has(it.id) ? [it.name + ' is sold out'] : [];
  }
  const p = PKG[e.pkgId];
  if (!p) return ['Unknown package'];
  const out = [];
  if (!(e.n >= p.min && e.n <= p.max)) out.push('Group size must be ' + p.min + ' to ' + p.max);
  for (const c of p.components) {
    const id = e.sel[c.slot];

/* ---------------- "server" (stands in for POST /orders) ---------------- */
function serverCreateOrder(pl) {
  const cart = JSON.parse(JSON.stringify(pl.cart));
  const key = pl.key;
  if (S.idem.key === key && Date.now() - S.idem.ts < 5000) return { ok: true, order: S.idem.order, dup: true };
  const issues = []; let total = 0, count = 0, hasPkg = false; const groups = [], singles = [];
  for (const e of cart) {
    const iss = entryIssues(e);
    if (iss.length) { issues.push(...iss); continue; }
    if (e.type === 'pkg') {
      const p = PKG[e.pkgId], q = quote(p, e.n, e.sel);
      total += q.total; count++; hasPkg = true;
      groups.push({ name: p.name, n: e.n, total: q.total, lines: q.lines.map(l => ({ name: l.item.name, qty: l.qty })) });
    } else {
      const it = ITEM[e.itemId], qty = Math.max(1, Math.min(20, e.qty | 0));
      total += it.price * qty; count += qty; singles.push({ name: it.name, qty });
    }
  }
  if (issues.length) return { ok: false, msg: issues.join('. ') + '. Fix your order and send it again.' };
  if (pl.clientTotal !== total) return { ok: false, msg: "The total didn't match the menu prices, so nothing was sent. Reopen your order and try again." };
  const lo = 6 + Math.ceil(count / 6) * 2;
  const order = {
    id: 100 + ((Date.now() / 1000 | 0) % 900), table: pl.table, groups, singles, total, hasPkg,
    pay: pl.pay === 'online' ? 'paid' : 'unpaid', note: pl.note, status: 'new', ts: Date.now(), wait: lo + '–' + (lo + 4), cart
  };
  S.idem = { key, ts: Date.now(), order };
  return { ok: true, order };
}

if (bc) bc.onmessage = ev => {

function receiveOrder(o, remote) {

function beep() {

    o.type = 'sine'; o.frequency.value = 880; o.connect(g); g.connect(c.destination);

}

      ${o.note ? `<div class="tnote">${esc(o.note)}</div>` : ''}
      ${o.status !== 'served' ? `<div class="tacts"><button data-act="status" data-id="${o.id}" data-ts="${o.ts}" data-s="${nextSt[o.status]}">${nextLbl[o.status]}</button></div>` : ''}</article>`;
    body = `<div style="margin-bottom:12px"><button class="sw" data-act="sound" aria-pressed="${S.soundOn}">${S.soundOn ? 'Sound alerts on' : 'Turn on sound alerts'}</button></div>
      ${act.length ? act.map(tk).join('') : '<div class="empty">No orders yet.<br>New orders from guests appear here within seconds.</div>'}
      ${done.length ? `<h2 style="font-size:18px;margin:20px 0 10px">Served</h2>${done.map(tk).join('')}` : ''}`;
  } else if (S.staffTab === 'stock') {
    body = `<p class="mu">Mark an item sold out and guests stop seeing it. Packages swap in another option, or disappear if nothing is left.</p>` +
      ITEMS.map(i => `<div class="row86"><span>${esc(i.name)}</span><button class="sw" data-act="eighty" data-id="${i.id}" aria-pressed="${S.eightySix.has(i.id)}">${S.eightySix.has(i.id) ? 'Sold out' : 'Available'}</button></div>`).join('');
  } else {
    const e = S.ev, pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
    body = `<div class="metrics">
      <div class="metric"><div class="n">${e.scan}</div><div class="l">Menu opens</div></div>
      <div class="metric"><div class="n">${pct(e.start, e.scan)}</div><div class="l">Opens that started an order</div></div>
      <div class="metric"><div class="n">${e.placed}</div><div class="l">Orders placed</div></div>
      <div class="metric"><div class="n">${pct(e.attach, e.placed)}</div><div class="l">Orders with a package</div></div>
      <div class="metric"><div class="n">${e.placed ? money(Math.round(e.revenue / e.placed)) : '—'}</div><div class="l">Average check</div></div>
      <div class="metric"><div class="n">${S.orders.filter(o => o.status !== 'served').length}</div><div class="l">Open orders</div></div></div>
      <p class="mu" style="margin-top:14px">Counts start when this page opens and hold no personal data. The live product sends a weekly email with these numbers against your baseline.</p>`;
  }
  $('#app').innerHTML = `<div class="shell wide"><div class="stitle"><h1>${esc(VENUE.name)}</h1></div>
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${S.staffTab === k}" data-act="staffTab" data-k="${k}">${l}</button>`).join('')}</div>${body}</div>`;
}

/* ---------------- master render ---------------- */
function render() {
  document.documentElement.dataset.skin = S.skin === 'tap' ? '' : S.skin;
  renderProto();
  S.view === 'guest' ? renderGuest() : renderStaff();
  renderCartbar(); renderSheet();
}
let tt;
function toast(msg) {
  const el = $('#toast'); el.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(tt); tt = setTimeout(() => { el.innerHTML = ''; }, 3600);
}

/* ---------------- actions ---------------- */
const uid = () => 'e' + (S.uid++);
function requireAge(fn) { if (S.ageOk) return fn(); S.pending = fn; S.sheet = 'age'; render(); }
function markStart() { if (!S.started) { S.started = true; bump('start'); } }
function addItem(id) {
  const it = ITEM[id]; if (!it || S.eightySix.has(id)) return;
  const go = () => {
    const e = S.cart.find(x => x.type === 'item' && x.itemId === id);
    e ? e.qty = Math.min(20, e.qty + 1) : S.cart.push({ id: uid(), type: 'item', itemId: id, qty: 1 });
    markStart(); S.err = ''; render();
  };
  it.alc ? requireAge(go) : go();
}
function addRound() {
  const p = PKG.round, r = S.round;
  const go = () => {
    const entry = { id: S.editing || uid(), type: 'pkg', pkgId: p.id, n: r.n, sel: { ...r.sel } };
    if (S.editing) {
      const i = S.cart.findIndex(e => e.id === S.editing);
      i >= 0 ? S.cart[i] = entry : S.cart.push(entry);
      S.editing = null; S.err = ''; markStart(); S.sheet = 'cart'; render(); return;
    }
    S.cart.push(entry); markStart(); S.err = ''; render(); toast('The Round for ' + r.n + ' added');
  };
  const q = quote(p, r.n, r.sel);
  q.lines.some(l => l.item.alc) ? requireAge(go) : go();
}
function submit(paid) {
  const key = S.table + '|' + JSON.stringify(S.cart.map(e => ({ ...e, id: 0 }))) + '|' + S.note + '|' + paid;
  const res = serverCreateOrder({ table: S.table, cart: S.cart, note: S.note.trim(), pay: paid ? 'online' : 'table', clientTotal: cartTotal(), key });
  if (!res.ok) { S.err = res.msg; S.sheet = 'cart'; render(); return; }
  const o = res.order;
  if (!res.dup) {
    receiveOrder(o); send({ t: 'order', order: o });
    bump('placed'); if (o.hasPkg) bump('attach'); bump('revenue', o.total);
  }
  S.lastOrder = o; S.cart = []; S.note = ''; S.err = ''; S.payErr = ''; S.editing = null; S.sheet = 'confirm'; render();
}
function tamper() {
  const cart = S.cart.length ? S.cart : [{ id: 't', type: 'pkg', pkgId: 'round', n: 4, sel: defSel(PKG.round) }];
  const total = cart.reduce((a, e) => a + entryTotal(e), 0);
  const res = serverCreateOrder({ table: S.table || 1, cart, note: '', pay: 'table', clientTotal: total - 500, key: 'tamper' + Date.now() });
  S.sheet = null; render(); toast(res.ok ? 'Unexpected: order accepted' : 'Server rejected the order: total did not match');
}
function setTable(n) {
  S.table = n; S.sheet = null;
  try { location.hash = '#/t/' + n; } catch (e) {}
  if (validTable(n)) bump('scan');
  render();
}
function parseHash() { const m = /#\/t\/(\d+)/.exec(location.hash || ''); return m ? parseInt(m[1], 10) : null; }

const actions = {
  view: d => { S.view = d.v; S.sheet = null; render(); window.scrollTo(0, 0); },
  tools: () => { S.sheet = 'tools'; render(); },
  closeSheet: () => { S.sheet = null; S.pending = null; render(); },
  ovClose: (d, b, e) => { if (e.target === b && S.sheet !== 'age') actions.closeSheet(); },
  rMinus: () => { S.round.n = Math.max(PKG.round.min, S.round.n - 1); updateRound('rMinus'); },
  rPlus: () => { S.round.n = Math.min(PKG.round.max, S.round.n + 1); updateRound('rPlus'); },
  swap: d => { S.round.open = S.round.open === d.slot ? null : d.slot; updateRound(); },
  pick: d => { S.round.sel[d.slot] = d.id; S.round.open = null; updateRound(); },
  addRound: () => addRound(),
  itemAdd: d => addItem(d.id),
  itemDec: d => {
    const e = S.cart.find(x => x.type === 'item' && x.itemId === d.id); if (!e) return;
    e.qty--; if (e.qty <= 0) S.cart = S.cart.filter(x => x !== e); S.err = ''; render();
  },
  removeEntry: d => { S.cart = S.cart.filter(e => e.id !== d.id); if (S.editing === d.id) S.editing = null; S.err = ''; if (!S.cart.length) S.sheet = null; render(); },
  editPkg: d => {
    const e = S.cart.find(x => x.id === d.id); if (!e) return;
    S.round.n = e.n; S.round.sel = { ...e.sel }; S.round.open = null; S.editing = e.id; S.sheet = null; render();
    const r = $('#round'); r && r.scrollIntoView({ behavior: 'smooth', block: 'start' });
    toast('Change your group or swaps, then tap Update The Round');
  },
  openCart: () => { S.sheet = 'cart'; render(); },
  payMode: d => { S.payMode = d.m; renderSheet(); },
  send: () => { if (!S.online) return; S.payMode === 'online' ? (S.payErr = '', S.sheet = 'pay', render()) : submit(false); },
  payBack: () => { S.sheet = 'cart'; render(); },
  payNow: () => {
    if (S.payFail) { S.payErr = "Payment didn't go through. Your order is still here. Try again or go back and pay at the table."; renderSheet(); return; }
    submit(true);
  },
  ageYes: () => { S.ageOk = true; S.sheet = null; const f = S.pending; S.pending = null; render(); f && f(); },
  ageNo: () => { S.pending = null; S.sheet = null; render(); },
  filter: d => { S.filters.has(d.k) ? S.filters.delete(d.k) : S.filters.add(d.k); render(); },
  clearFilters: () => { S.filters.clear(); render(); },
  pickTable: () => { S.sheet = 'table'; render(); },
  setTable: d => setTable(parseInt(d.n, 10)),
  sameAgain: () => {
    if (!S.lastOrder) return;
    const copy = JSON.parse(JSON.stringify(S.lastOrder.cart)).map(e => ({ ...e, id: uid() }));
    S.cart.push(...copy); S.sheet = 'cart'; S.err = ''; render();
  },
  toggleOnline: () => { S.online = !S.online; render(); toast(S.online ? 'Back online' : 'Offline. Your cart is kept on this phone.'); },
  toggleFail: () => { S.payFail = !S.payFail; renderSheet(); },
  skin: d => { S.skin = d.k; render(); },
  tamper: () => tamper(),
  reset: () => { S.orders = []; S.cart = []; S.lastOrder = null; S.eightySix = new Set(); S.ev = { scan: 0, start: 0, placed: 0, attach: 0, revenue: 0 }; S.started = false; S.sheet = null; render(); },
  staffTab: d => { S.staffTab = d.k; render(); },
  sound: () => { S.soundOn = !S.soundOn; if (S.soundOn) { const t = S.soundOn; beep(); } render(); },
  status: d => { applyStatus(parseInt(d.id, 10), d.s); send({ t: 'status', id: parseInt(d.id, 10), status: d.s }); },
  eighty: d => {
    S.eightySix.has(d.id) ? S.eightySix.delete(d.id) : S.eightySix.add(d.id);
    send({ t: '86', ids: [...S.eightySix] }); render();
  }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const fn = actions[b.dataset.act]; if (fn) fn(b.dataset, b, e);
});
document.addEventListener('input', e => { if (e.target.id === 'note') S.note = e.target.value; });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet && S.sheet !== 'age') actions.closeSheet(); });
window.addEventListener('hashchange', () => { const t = parseHash(); if (t !== S.table) { S.table = t; if (validTable(t)) bump('scan'); render(); } });
setInterval(() => { if (S.view === 'staff' && S.staffTab === 'orders' && !S.sheet) render(); }, 30000);

/* boot: behave like a QR scan */
(function init() {
  const t = parseHash();
  S.table = t === null ? 12 : t;
  if (validTable(S.table)) bump('scan');
  render();
})();
</script>
</body>
</html>
